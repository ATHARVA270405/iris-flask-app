<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Iris Species Classifier</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>


<body>

    <div class="container">

        <h1>Iris Species Classifier</h1>

        <p class="description">
            Enter the flower measurements to predict
            the Iris species.
        </p>


        <form action="/predict" method="POST">

            <!-- Sepal Length -->

            <label for="sepal_length">
                Sepal Length (cm)
            </label>

            <input
                type="number"
                step="0.1"
                id="sepal_length"
                name="sepal_length"
                placeholder="Example: 5.1"
                required
            >


            <!-- Sepal Width -->

            <label for="sepal_width">
                Sepal Width (cm)
            </label>

            <input
                type="number"
                step="0.1"
                id="sepal_width"
                name="sepal_width"
                placeholder="Example: 3.5"
                required
            >


            <!-- Petal Length -->

            <label for="petal_length">
                Petal Length (cm)
            </label>

            <input
                type="number"
                step="0.1"
                id="petal_length"
                name="petal_length"
                placeholder="Example: 1.4"
                required
            >


            <!-- Petal Width -->

            <label for="petal_width">
                Petal Width (cm)
            </label>

            <input
                type="number"
                step="0.1"
                id="petal_width"
                name="petal_width"
                placeholder="Example: 0.2"
                required
            >


            <button type="submit">
                Predict Species
            </button>

        </form>


        <!-- Display prediction -->

        {% if prediction %}

        <div class="result">

            <h2>Prediction</h2>

            <p>
                The predicted Iris species is:
            </p>

            <strong>
                {{ prediction }}
            </strong>

        </div>

        {% endif %}


    </div>

</body>

</html>
